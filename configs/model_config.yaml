# ============================================================
# Candidate Intelligence System — Model Configuration
# ============================================================

# --- Embedding Models ---
embedding:
  primary:
    name: "BAAI/bge-base-en-v1.5"
    dimension: 768
    max_seq_length: 512
    normalize: true
    batch_size: 32
    dtype: "float32"
  alternative:
    name: "intfloat/e5-base-v2"
    dimension: 768
    max_seq_length: 512
  fallback:
    name: "all-MiniLM-L6-v2"
    dimension: 384
    max_seq_length: 256

# --- Cross-Encoder ---
cross_encoder:
  name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  max_length: 512
  batch_size: 8

# --- spaCy ---
spacy:
  model: "en_core_web_sm"

# --- LTR Ranker ---
ranker:
  xgboost:
    objective: "rank:ndcg"
    eval_metric: "ndcg@10"
    default_params:
      learning_rate: 0.1
      max_depth: 6
      n_estimators: 500
      min_child_weight: 3
      subsample: 0.8
      colsample_bytree: 0.8
      tree_method: "hist"
    optuna_search_space:
      learning_rate: [0.01, 0.3]
      max_depth: [3, 8]
      n_estimators: [100, 1000]
      min_child_weight: [1, 10]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]
    optuna_trials: 50

  lightgbm:
    objective: "lambdarank"
    metric: "ndcg"
    default_params:
      learning_rate: 0.1
      num_leaves: 63
      min_data_in_leaf: 20
      feature_fraction: 0.8
      n_estimators: 500
    optuna_search_space:
      num_leaves: [31, 255]
      learning_rate: [0.01, 0.3]
      min_data_in_leaf: [5, 50]
      feature_fraction: [0.6, 1.0]
    optuna_trials: 50

# --- Authenticity Model ---
authenticity:
  model_type: "xgboost_regressor"
  calibration: "isotonic"
  threshold: 0.5  # Advisory only; never used for hard rejection

# --- Anomaly Detection ---
anomaly:
  model: "isolation_forest"
  contamination: 0.05
  n_estimators: 100

# --- Feature Selection ---
feature_selection:
  variance_threshold: 0.0
  correlation_threshold: 0.95
  target_features: 120
  rfe_step: 10

# --- Model Paths ---
paths:
  ranker_dir: "./models/ranker"
  embedding_dir: "./models/embeddings"
  authenticity_dir: "./models/authenticity"
  cross_encoder_dir: "./models/cross_encoder"
  registry: "./models/registry/model_registry.json"

# --- Training ---
training:
  cv_folds: 5
  random_state: 42
  test_size: 0.15
  val_size: 0.15
