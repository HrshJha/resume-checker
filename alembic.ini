# Alembic Configuration

[alembic]
script_location = alembic
prepend_sys_path = .
# L-2: This URL is for local development only (SQLite).
# For production PostgreSQL migrations, override via:
#   SQLALCHEMY_URL="postgresql+psycopg2://user:password@host:5432/dbname" alembic upgrade head
# Or set sqlalchemy.url to the production DSN before running migrations.
sqlalchemy.url = sqlite:///./data/candidate_ai.db



[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
